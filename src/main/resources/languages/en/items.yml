NTW_CONTROLLER:
  name: "&3Network Controller"
  type:
    - "&7&oMachine"
  description:
    - "&7The Network Controller is the brain"
    - "&7for the whole network."
  stats:
    - "&7Limit: &eMax 1&7 per network"

NTW_BRIDGE:
  name: "&3Network Bridge"
  type:
    - "&7&oMachine"
  description:
    - "&7The Bridge allows you to cheaply"
    - "&7connect network objects together."

NTW_MONITOR:
  name: "&3Network Monitor"
  type:
    - "&7&oMachine"
  description:
    - "&7The Network Monitor allows simple"
