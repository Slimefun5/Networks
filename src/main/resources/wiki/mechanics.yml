# Body text for Networks' wiki topics, keyed by the topic id declared in topics.yml.
# Rendered as paginated tooltip text; keep lines short (~45 chars).

networks_basics:
  - '&e&lBuilding a Network'
  - '&7Every network needs one &eController&7.'
  - '&7It powers the network and everything'
  - '&7else connects back to it.'
  - ''
  - '&7&lBridges &7extend reach. Place them to'
  - '&7carry the network further than the'
  - '&7controller alone can span.'
  - ''
  - '&7&lCells &7provide storage. The network can'
  - '&7only hold what its cells can hold, so'
  - '&7add cells as you grow.'
  - ''
  - '&7Power is shared: a network short on'
  - '&7charge stops working before it starts'
  - '&7losing items, so watch the controller.'

networks_crafting:
  - '&e&lBlueprints'
  - '&7The &eRecipe Encoder &7turns a recipe into'
  - '&7a blueprint the crafter can run.'
  - ''
  - '&7Place a blank blueprint, lay the recipe'
  - '&7out in the 3x3 grid, then click to'
  - '&7encode. The network pays the charge.'
  - ''
  - '&e&lWhat can be encoded'
  - '&7Vanilla crafting-table recipes, and'
  - '&7Slimefun recipes made in the &eEnhanced'
  - '&7Crafting Table&7.'
  - ''
  - '&7Recipes from other machines (Ore'
  - '&7Crusher, Compressor, Magic Workbench'
  - '&7and so on) cannot be encoded.'
  - ''
  - '&e&lAuto Crafting'
  - '&7Put the blueprint in the &eAuto Crafter&7.'
  - '&7It pulls the ingredients from network'
  - '&7storage, so everything the recipe needs'
  - '&7must be in the network, not the machine.'
  - ''
  - '&7If an ingredient is missing the crafter'
  - '&7returns what it took and waits.'

networks_grid:
  - '&e&lThe Grid'
  - '&7The Grid is the window into everything'
  - '&7your network stores.'
  - ''
  - '&7Search by name to filter the view, then'
  - '&7click an item to pull it out. Items go'
  - '&7back in through any input point.'
  - ''
  - '&7The Grid shows the network as one pool,'
  - '&7no matter how many cells hold it, so'
  - '&7you never need to know which cell has'
  - '&7what.'
